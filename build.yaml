# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Dongle = BLE central + USB to the PC. ZMK Studio lives here now.
  - board: nice_nano_v2
    shield: sofle_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Both halves are now peripherals of the dongle.
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  # Flash this to every device once before flashing the new firmware.
  - board: nice_nano_v2
    shield: settings_reset
