# Sofle dongle (central). No display yet — add screen config here later.

# The shared config/sofle.conf is merged before this file and forces
# CONFIG_ZMK_DISPLAY=y. The dongle overlay has no `zephyr,display` node yet, so
# building the display subsystem fails (undeclared DT_CHOSEN_zephyr_display).
# Turn it off here (this conf is merged last, so it wins). Re-enable when the
# dongle's screen is added.
CONFIG_ZMK_DISPLAY=n

# Likewise, sofle.conf enables EC11 for the halves' encoders; the dongle has no
# physical encoders (the overlay declares them disabled only for sensor
# relaying), so don't build the encoder driver here.
CONFIG_EC11=n

# Keep ZMK Studio usable without an unlock keypress (matches sofle.conf).
CONFIG_ZMK_STUDIO_LOCKING=n

# A dongle is USB-powered, so the BLE TX power can be cranked up for range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
